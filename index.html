<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Polyfill/Patch to prevent Uncaught TypeError on read-only window.fetch inside sandbox iframes -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var fetchValue = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return fetchValue;
              },
              set: function(val) {
                fetchValue = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || Window.prototype;
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var fetchValueProto = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return fetchValueProto;
                },
                set: function(val) {
                  fetchValueProto = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {
            console.warn('Could not patch window.fetch fallback:', err);
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wonder Lanka Experience | Premium Sri Lanka Tours & Luxury Travels</title>
    <meta name="description" content="Discover Sri Lanka with Wonder Lanka Experience. Authentic cultural tours, wildlife safari glamping, surfing packages, honeymoons, and custom tailor-made itineraries." />
    <meta name="keywords" content="Sri Lanka Tours, Sri Lanka Travel Packages, Sri Lanka Tour Operator, Sri Lanka Holidays, Sri Lanka Vacation Packages, Best Sri Lanka Tours, Sri Lanka Travel Guide, Sri Lanka Tourism, Sri Lanka Adventure Tours, Luxury Sri Lanka Tours" />
    
    <!-- Open Graph (OG) Facebook tags -->
    <meta property="og:title" content="Wonder Lanka Experience | Premium Sri Lanka Travel Agency" />
    <meta property="og:description" content="Explore ancient heritage, misty mountains, wild national safaris, and gold sand surfs. Custom 5★ packages tailored by local experts." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1588598130841-3837f8a35e74?auto=format&fit=crop&q=80&w=1200" />

    <!-- Splash loader: inline so it paints before the app bundle arrives. Removed by src/effects.ts -->
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #f8f2e7;
        transition: opacity .6s ease, visibility .6s ease;
      }
      #app-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #app-loader .loader-mark {
        font-family: "Playfair Display", Georgia, serif; font-weight: 700;
        font-size: clamp(24px, 5vw, 38px); letter-spacing: -0.01em;
        display: flex; gap: .3em;
      }
      #app-loader .loader-mark span { opacity: 0; transform: translateY(12px); animation: loader-word .6s cubic-bezier(.22,1,.36,1) forwards; }
      #app-loader .loader-mark span:nth-child(1) { color: #D95C1C; }
      #app-loader .loader-mark span:nth-child(2) { color: #16B1BC; animation-delay: .12s; }
      #app-loader .loader-mark span:nth-child(3) { color: #5BA370; animation-delay: .24s; }
      #app-loader .loader-track { width: 160px; height: 3px; border-radius: 3px; background: #e7ddcb; overflow: hidden; }
      #app-loader .loader-track::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #D95C1C, #16B1BC, #5BA370);
        animation: loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes loader-word { to { opacity: 1; transform: none; } }
      @keyframes loader-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-mark span { animation: none; opacity: 1; transform: none; }
        #app-loader .loader-track::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body class="bg-neutral-900 text-neutral-100 font-sans">
    <div id="app-loader" role="status" aria-label="Loading Wonder Lanka Experience">
      <div class="loader-mark"><span>Wonder</span><span>Lanka</span><span>Experience</span></div>
      <div class="loader-track"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
