name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repo's Pages source is still "Deploy from a branch", GitHub also runs its own
      # "pages-build-deployment", which publishes the raw (unbuilt) files. Wait for it so this
      # built site is always published last. Once the source is "GitHub Actions" no such run
      # appears and this step finishes after about two minutes of checking.
      - name: Wait for GitHub's branch-based Pages deploy to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages-build-deployment --commit "$GITHUB_SHA" --json status --jq 'length' 2>/dev/null || echo 0)
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages-build-deployment --commit "$GITHUB_SHA" --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            echo "branch deploy runs: $runs, still running: $pending"
            if [ "$runs" -gt 0 ] && [ "$pending" -eq 0 ]; then break; fi
            if [ "$runs" -eq 0 ] && [ "$i" -ge 12 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
